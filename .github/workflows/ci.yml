name: CI

# Aucun build sur push `main` : le travail arrive en direct sur main, donc un
# build par commit ne ferait que du bruit. Les gates tournent sur PR, sur tag
# (avant toute signature/publication) et à la demande.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo test
      - run: cargo doc --no-deps
